aid: 21st
name: 21st
description: >-
  21st (21st.dev) is a Y Combinator-backed company building an open, community-driven
  registry of crafted React, Next.js and Tailwind CSS UI components, plus the tooling to
  generate and consume them with AI. Its flagship product, Magic MCP, is an AI agent that
  drops into Cursor, Windsurf, Cline, VS Code and Claude Code to generate production-ready
  UI components from natural-language prompts. The platform also ships a remote hosted MCP
  server, the @21st-dev/cli terminal client, a private component registry CLI, published
  Agent Skills, and the @21st-sdk toolkit for building, deploying and embedding AI coding
  agents. Founded by Serafim Korablev and Sergey Bunas, 21st lets teams bring craft and
  taste back to digital products and build UIs that reflect their own design vision rather
  than generic LLM output.
